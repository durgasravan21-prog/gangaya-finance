function qitems(h){const o=[],td=today();
for(const t of T){if(t.past||!!t.sent!=!!h)continue;const m=M.find(x=>x.id==t.mid);if(!m||m.archived)continue;
o.push({k:'t'+t.id,m,d:t.d,ts:t.ts,tag:t.type=='pay'?`Payment ${inr(t.amt)} · ${t.mode=='upi'?'UPI':'Cash'}${loanClosed(m,t)?' · Loan closed ✓':''}`:`New loan ${inr(t.amt)}`,text:msg(t),mk:()=>db.doc('txns/'+t.id).update({sent:true})})}
if(!h)for(const m of M){
  if(m.archived)continue;
  const s=st(m);
  if(!s.next||s.due<=0)continue;
  if(T.some(t=>t.mid==m.id&&t.d==td&&t.type=='pay'))continue;
  const dl=Math.round((new Date(s.next+'T00:00:00')-new Date(td+'T00:00:00'))/864e5),id=m.id+'_'+s.next;
  if(dl>2||dl<-60||RM.has(id)||RM.has(m.id+'_'+td))continue;
  o.push({k:'r'+id,m,d:s.next,ts:0,tag:dl<0?('Overdue · '+Math.abs(dl)+'d'):('Reminder · '+(dl<=0?'due today':'in '+dl+(dl==1?' day':' days'))),text:rmsg(m,s),mk:()=>db.doc('rem/'+id).set({mid:m.id,d:s.next,sent:true,ts:Date.now()})});
}
return o}
function getRemList(allMembers){
  const td=today(),list=[];
  for(const m of M){
    if(m.archived)continue;
    const s=st(m);
    if(s.due<=0)continue;
    const paidToday = T.some(t => t.mid == m.id && t.d == td && t.type == 'pay');
    if(paidToday && !allMembers) continue;
    const dl=s.next?Math.round((new Date(s.next+'T00:00:00')-new Date(td+'T00:00:00'))/864e5):null;
    const isOd=dl!==null&&dl<0,isTd=dl===0,isUp=dl!==null&&dl>0&&dl<=2;
    if(!allMembers && !isOd && !isTd && !isUp) continue;
    list.push({m,s,dl:dl===null?9999:dl,isOd,isTd,isUp,paidToday});
  }
  return list.sort((a,b)=>a.dl-b.dl);
}
